server {
    listen 80;
    server_name equipo-1-eleV-n-dev.apolobyte.online;

    # Servir el frontend (archivos generados por React/Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Redirigir llamadas de la API al backend
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
