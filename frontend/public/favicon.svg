<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#D9381E"/>
    </linearGradient>
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5EFE6"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base App Squircle Container -->
  <rect width="64" height="64" rx="16" fill="url(#brandGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Tactical Meal Ticket Silhouette with side punch notches -->
  <g filter="url(#subtleShadow)">
    <path d="M 14 12
             C 14 9.8 15.8 8 18 8
             H 46
             C 48.2 8 50 9.8 50 12
             V 26
             A 6 6 0 0 0 50 38
             V 52
             C 50 54.2 48.2 56 46 56
             H 18
             C 15.8 56 14 54.2 14 52
             V 38
             A 6 6 0 0 0 14 26
             Z"
          fill="url(#ticketGrad)"/>
  </g>

  <!-- Ticket Perforation Dotted Line -->
  <line x1="16" y1="32" x2="48" y2="32" stroke="#D9381E" stroke-width="1.5" stroke-dasharray="2.5 2.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Upper Half: Crossed Utensils (Fork & Knife / Spoon) in Brand Color -->
  <g stroke="#D9381E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Fork diagonal -->
    <path d="M 23 16 L 33 26"/>
    <path d="M 21 18 L 24 15"/>
    <path d="M 24 21 L 27 18"/>
    <!-- Knife diagonal -->
    <path d="M 41 16 L 31 26"/>
    <path d="M 37 14 C 42 17 40 21 34 23"/>
  </g>

  <!-- Lower Half: 3 Lunch Punch Tokens (Prepaid Meals) -->
  <g fill="#D9381E">
    <!-- Punched Active Token 1 -->
    <circle cx="24" cy="44" r="3.2"/>
    <!-- Punched Active Token 2 -->
    <circle cx="32" cy="44" r="3.2"/>
    <!-- Token 3 (Remaining / Outlined) -->
    <circle cx="40" cy="44" r="2.4" fill="none" stroke="#D9381E" stroke-width="1.6"/>
  </g>
</svg>